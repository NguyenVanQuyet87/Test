<input type="range" id="rotationYSlider" min="-180" max="180" step="1" value="0">

  <script type="module">
  import * as THREE from "https://esm.sh/three@0.160.0";

  const infoEl = document.getElementById("info");
  const markerStatusEl = document.getElementById("markerStatus");
  const resetBtn = document.getElementById("resetBtn");
  const placementBtn = document.getElementById("placementBtn");
  const selectBtn = document.getElementById("selectBtn");
  const adjustBtn = document.getElementById("adjustBtn");
  const localBtn = document.getElementById("localBtn");
  const worldBtn = document.getElementById("worldBtn");
  const markerOverlay = document.getElementById("markerOverlay");
  const qrFrame = document.querySelector('.qr-frame');
  const heightSlider = document.getElementById("heightSlider");
  const rotationXSlider = document.getElementById("rotationXSlider");
  const rotationYSlider = document.getElementById("rotationYSlider");
  const rotationZSlider = document.getElementById("rotationZSlider");
  let modelTemplate = null;
  let currentAnchor = null;
  let reticle;
  let hitTestSource = null;
  let lastHitResult = null;
  let currentModel = null;
  let isDragging = false;
  let previousTouchX = 0;
  let previousTouchY = 0;
  let isPlacing = false;
  let markerDetected = false;
  let markerPose = null;
  const allAnchors = new Set();
  let adjustMode = false;
  let axesGroup = null;
  let worldAxesGroup = null;
  let isLocalAxes = false;
  let lastHeightValue = 0;
  let lastRotationValue = 0;

  const scene = new THREE.Scene();
  //const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
  const aspect = window.innerWidth / window.innerHeight;
  const d = 2; // zoom size, bạn điều chỉnh cho vừa
  const camera = new THREE.OrthographicCamera(
    -d * aspect, d * aspect, d, -d, 0.1, 100
  );
  camera.position.set(5, 5, 5);
  camera.lookAt(0, 0, 0);
    
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, precision: "highp" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);
    
  const PLACEMENTS_ROOT = new THREE.Group();
  scene.add(PLACEMENTS_ROOT);

  // Hàm cập nhật vị trí và kích thước của hiệu ứng quét QR dựa trên vị trí marker
  function updateQRFramePosition(pose) {
    if (!pose) return;
    
    // Lấy ma trận chuyển đổi từ pose
    const matrix = new THREE.Matrix4().fromArray(pose.transform.matrix);
    const position = new THREE.Vector3();
    const scale = new THREE.Vector3();
    const quaternion = new THREE.Quaternion();
    matrix.decompose(position, quaternion, scale);
    
    // Chuyển đổi vị trí 3D sang tọa độ màn hình 2D
    const vector = position.clone();
    vector.project(camera);
    
    const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
    const y = -(vector.y * 0.5 - 0.5) * window.innerHeight;
    
    // Ước tính kích thước của marker trên màn hình dựa trên khoảng cách
    const distance = position.distanceTo(camera.position);
    const markerSize = (0.15 / distance) * 500; // 0.15 là widthInMeters của marker
    
    // Cập nhật vị trí và kích thước của khung QR
    qrFrame.style.width = `${markerSize}px`;
    qrFrame.style.height = `${markerSize}px`;
    qrFrame.style.left = `${x - markerSize/2}px`;
    qrFrame.style.top = `${y - markerSize/2}px`;
    
    // Hiển thị overlay
    markerOverlay.style.display = 'block';
  }

  // Ẩn hiệu ứng quét QR
  function hideQRFrame() {
    markerOverlay.style.display = 'none';
  }

  async function initARButton() {

    if (!supported) { infoEl.textContent = "Thiết bị không hỗ trợ AR."; return; }
    // Load marker image
    try {
      const imgBitmap = await fetch("marker.png")
        .then(r => r.blob())
        .then(b => createImageBitmap(b));
      
      //document.body.appendChild(ARButton.createButton(renderer, {
        //requiredFeatures: ["image-tracking"],
        //trackedImages: [
          //{
            //image: imgBitmap,
            widthInMeters: 0.15
          //}
        //],
        //optionalFeatures: ["hit-test", "anchors", "dom-overlay"],
        //domOverlay: { root: document.body }
      //}));

        requiredFeatures: ["hit-test"],
        optionalFeatures: ["image-tracking","depth-sensing", "anchors", "dom-overlay"],
        trackedImages: [
          {
            image: imgBitmap,
            widthInMeters: 0.15
          }
        ],

        // Nếu depth-sensing được hỗ trợ thì sẽ đọc block này

          usagePreference: ["cpu-optimized", "gpu-optimized"],
          dataFormatPreference: ["luminance-alpha", "float32"]
        }
      }));
    } catch (e) {
      console.error("Lỗi khi tải marker:", e);
      infoEl.textContent = "Lỗi khi tải marker.png - vui lòng kiểm tra file và console";
    }
  }
  initARButton();

  // Tạo ánh sáng cho vật liệu
  scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);
    
  const ringGeo = new THREE.RingGeometry(0.08,0.1,32).rotateX(-Math.PI/2);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
  reticle = new THREE.Mesh(ringGeo, ringMat);
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // Tạo hình khối mẫu nếu không tải được GLTF
  function createFallbackModel() {
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const cube = new THREE.Mesh(geometry, material);
    const group = new THREE.Group();
    group.add(cube);
    group.scale.set(1, 1, 1);
    return group;
  }
  // Hệ tọa độ của file GTLF thì trục Y sẽ hướng lên trên, trục Z hướng dọc mô hình
  const loader = new GLTFLoader();
  loader.load("test.glb", (gltf)=>{
    modelTemplate = gltf.scene;
    modelTemplate.scale.set(0.2,0.2,0.2);
    // Xoay từ hệ glTF (+Y up) sang hệ WebXR
    modelTemplate.rotation.x = Math.PI / 2;
    console.log(gltf.scene)
    console.log(gltf.parser)
    infoEl.textContent = "Model đã load — di chuyển camera để tìm mặt phẳng hoặc marker.";
    
  }, undefined, (err)=>{
    console.error("GLTF load error:", err);
    infoEl.textContent = "Lỗi load GLTF — tạo model mẫu thay thế.";
    modelTemplate = createFallbackModel();
  });
    
// Hàm chỉnh vật liệu
function adjustMaterial(material) {
  if (material instanceof THREE.MeshPhongMaterial) {
    material.shininess = 50; // bóng loáng hơn
  }
  if (material instanceof THREE.MeshStandardMaterial || 
      material instanceof THREE.MeshPhysicalMaterial) {
    material.roughness = 0.2; // càng nhỏ càng bóng
    material.metalness = 0.5; // càng cao càng giống gương
  }
  material.needsUpdate = true;
}
    
  function cloneModel(template) {
    const clone = template.clone(true);
    clone.traverse((n)=>{
      if (n.isMesh && n.material) {
        n.material = n.material.clone();
        n.material.transparent = true;
        n.material.userData.__cloned = true;
        if (Array.isArray(n.material)) {
          n.material.forEach(m => adjustMaterial(m));
        } else {
          adjustMaterial(n.material);
        }
      }
    });
    return clone;
  }

  function clearAllPlacementsAndAnchors() {
    if (allAnchors.size) {
      for (const a of allAnchors) { try { if (a.delete) a.delete(); } catch(e){} }
      allAnchors.clear();
    }
    while (PLACEMENTS_ROOT.children.length) {
      const child = PLACEMENTS_ROOT.children[0];
      PLACEMENTS_ROOT.remove(child);
    }
    currentAnchor = null;
    currentModel = null;
  }

    // Hàm đặt mô hình lên marker với hướng trục X trùng với pháp tuyến của marker
function placeModelOnMarker(pose) {
    if (!modelTemplate || isPlacing) return;
    
    isPlacing = true;
    clearAllPlacementsAndAnchors();
    
    const group = new THREE.Group();
    group.matrixAutoUpdate = false;
    
    // Sử dụng ma trận từ pose của marker
    // matrix/quaternion đã lấy từ pose
    const matrix = new THREE.Matrix4().fromArray(pose.transform.matrix);
    const position = new THREE.Vector3();
    const quaternion = new THREE.Quaternion();
    const scale = new THREE.Vector3();
    matrix.decompose(position, quaternion, scale);
    
    // Các trục trong hệ local của marker (KHÔNG PHẢI trục world)
    const localX = new THREE.Vector3(1,0,0); // nằm trên mặt
    const localY = new THREE.Vector3(0,1,0); // PHÁP TUYẾN marker
    const localZ = new THREE.Vector3(0,0,1); // nằm trên mặt
    // Đưa sang world
    const markerRight  = localX.clone().applyQuaternion(quaternion); // nằm ngang
    const markerNormal = localY.clone().applyQuaternion(quaternion); // pháp tuyến mặt
    const markerUp = localZ.clone().applyQuaternion(quaternion); // nằm ngang
    
    let modelXAxis = markerNormal.clone().negate();   // +X model = vào trong marker (ngược với normal)
    let modelYAxis = markerRight.clone().negate();                // +Z model = lên trên
    let modelZAxis = markerUp.clone().negate();                // +Z model = lên trên
    
    // Bảo đảm trực giao/chuẩn hoá
    modelXAxis.normalize();
    modelZAxis.normalize();
    modelYAxis.copy(new THREE.Vector3().crossVectors(modelZAxis, modelXAxis)).normalize();
    
    // Tạo ma trận biến đổi
    const modelMatrix = new THREE.Matrix4().makeBasis(modelXAxis, modelYAxis, modelZAxis);
    modelMatrix.setPosition(position);
    
    // Áp dụng ma trận cho group
    group.matrix.copy(modelMatrix);
    
    PLACEMENTS_ROOT.add(group);
    
    const placed = cloneModel(modelTemplate);
    group.add(placed);
    currentModel = placed;
    
    // Tạo anchor nếu có thể
    if (pose && pose.createAnchor) {
      pose.createAnchor().then(anchor => {
        currentAnchor = { anchor, group };
        allAnchors.add(anchor);
      }).catch(console.error);
    }
    
    infoEl.textContent = "Model đã được đặt trên marker! Trục X vào marker, Y sang trái, Z lên trên.";
    
    markerDetected = false;
    
    // Ẩn hiệu ứng quét sau khi đặt model
    hideQRFrame();
    
    // Debug: hiển thị các trục của marker
    debugAxes(group, modelXAxis, modelYAxis, modelZAxis);
}

// Hàm debug để hiển thị các trục
function debugAxes(group, xAxis, yAxis, zAxis) {
    const axisLength = 0.2;
    
    // Trục X (đỏ) - hướng vào marker
    const xGeometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(axisLength, 0, 0,)
    ]);
    const xMaterial = new THREE.LineBasicMaterial({ color: 0xff0000 });
    const xAxisLine = new THREE.Line(xGeometry, xMaterial);
    group.add(xAxisLine);
    
    // Trục Y (xahn lá) - hướng sang trái
    const yGeometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, axisLength, 0)
    ]);
    const yMaterial = new THREE.LineBasicMaterial({ color: 0x00ff00 });
    const yAxisLine = new THREE.Line(yGeometry, yMaterial);
    group.add(yAxisLine);
    
    // Trục Z (xanh dương) - hướng lên trên
    const zGeometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, axisLength)
    ]);
    const zMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff });
    const zAxisLine = new THREE.Line(zGeometry, zMaterial);
    group.add(zAxisLine);
}
    
  // --- orientation helpers ---
  let _lastHDir = new THREE.Vector3(1, 0, 0);
  function getCameraHorizontalDir() {
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    fwd.y = 0;
    const len = fwd.length();
    if (len < 1e-3) return _lastHDir.clone();
    fwd.divideScalar(len);
    _lastHDir.copy(fwd);
    return fwd;
  }

function computePlacementMatrixFromMatrix(baseMatrix) {
  const poseMat = new THREE.Matrix4().copy(baseMatrix);

  // Lấy normal từ mặt phẳng (giữ là "up")
  const rotMat = new THREE.Matrix4().extractRotation(poseMat);
  const normal = new THREE.Vector3(0,1,0).applyMatrix4(rotMat).normalize();

  // Lấy hướng forward theo camera (x-axis theo định nghĩa của bạn)
  const camFwd = getCameraHorizontalDir();

  // Chiếu forward lên mặt phẳng
  const camProj = camFwd.clone().projectOnPlane(normal);
  if (camProj.length() < 1e-3) {
    camProj.copy(_lastHDir).projectOnPlane(normal);
    if (camProj.length() < 1e-3) camProj.set(1,0,0);
  }
  camProj.normalize();

  // Đặt trục theo quy ước mới
  const xAxis = camProj.clone();                   // X = ra khỏe camera
  const zAxis = normal.clone().normalize();        // Z = lên trên
  const yAxis = new THREE.Vector3().crossVectors(zAxis, xAxis).normalize(); 
  // Y = trái (cross theo Z × X)

  // Tạo hệ cơ sở
  const basis = new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis);

  // Đặt vị trí
  const pos = new THREE.Vector3().setFromMatrixPosition(poseMat);
  basis.setPosition(pos);

  return basis;
}
let initialWorldMatrix = null;
let initialGroupMatrix = null;
async function placeAnchorFromLastHit() {
  if (isPlacing) return;
  const hit = lastHitResult;
  const refSpace = renderer.xr.getReferenceSpace();
  if (!hit || !refSpace || !modelTemplate) { isPlacing = false; return; }
  
  clearAllPlacementsAndAnchors();
  const pose = hit.getPose(refSpace);
  const anchor = await hit.createAnchor?.(refSpace).catch(() => null);

  // Nếu không tạo được anchor thì bỏ qua
  if (!pose || !anchor) {
    infoEl.textContent = "Không thể tạo anchor, mô hình sẽ không được đặt.";
    isPlacing = false;
    return;

    // Phần này xác định điểm trên vật thật xử dụng Depth Api
    
let depthData = null;

// Hàm lấy hit point trên vật thật
async function getHitPointWithDepthAPI(x, y) {
    if (!depthData) return null;

    const viewerPose = frame.getViewerPose(referenceSpace);
    if (!viewerPose) return null;

    // Lấy ray từ camera đến điểm click
    const ray = getRayFromScreenPoint(x, y, viewerPose);
    
    // Sử dụng depth data để tìm hit point
    const hitPoint = findHitPointWithDepthData(ray, depthData, viewerPose);
    
    return hitPoint;
}

// Hàm tạo ray từ điểm màn hình
function getRayFromScreenPoint(x, y, viewerPose) {
    const view = viewerPose.views[0];
    const devicePixelRatio = window.devicePixelRatio || 1;
    
    // Chuyển đổi tọa độ màn hình sang normalized device coordinates
    const ndcX = (x * devicePixelRatio / view.viewport.width) * 2 - 1;
    const ndcY = -(y * devicePixelRatio / view.viewport.height) * 2 + 1;
    
    // Tạo ray trong không gian camera
    const rayOrigin = new THREE.Vector3(0, 0, 0);
    const rayDirection = new THREE.Vector3(ndcX, ndcY, -1)
        .unproject(view.camera)
        .sub(rayOrigin)
        .normalize();
    
    return {
        origin: rayOrigin.applyMatrix4(view.transform.matrix),
        direction: rayDirection.transformDirection(view.transform.matrix)
    };
}
function findHitPointWithDepthData(ray, depthData, viewerPose) {
    const view = viewerPose.views[0];
    const depthInfo = depthData.getDepthInMeters(view);
    
    if (!depthInfo) return null;
    
    const maxDistance = 10.0; // Khoảng cách tối đa
    const stepSize = 0.1;     // Bước kiểm tra
    
    // Ray marching để tìm hit point
    let currentDistance = 0;
    while (currentDistance < maxDistance) {
        const samplePoint = ray.origin.clone()
            .add(ray.direction.clone().multiplyScalar(currentDistance));
        
        // Chuyển điểm sang UV coordinates
        const uv = worldToUV(samplePoint, view, depthInfo);
        
        if (uv) {
            // Lấy depth value từ depth buffer
            const depthValue = getDepthValue(uv.u, uv.v, depthInfo);
            
            if (depthValue !== null && Math.abs(currentDistance - depthValue) < 0.05) {
                // Tìm thấy hit point!
                return samplePoint;
            }
        }
        
        currentDistance += stepSize;
    }
    
    return null;
}
   function worldToUV(worldPoint, view, depthInfo) {
    // Chuyển world point sang clip space
    const clipSpace = worldPoint.clone()
        .applyMatrix4(view.projectionMatrix)
        .applyMatrix4(view.transform.inverse.matrix);
    
    // Chuyển clip space sang UV coordinates
    const u = (clipSpace.x + 1) / 2;
    const v = (-clipSpace.y + 1) / 2;
    
    // Kiểm tra trong bounds
    if (u >= 0 && u <= 1 && v >= 0 && v <= 1) {
        return { u, v };
    }
    
    return null;
}
function getDepthValue(u, v, depthInfo) {
    const width = depthInfo.width;
    const height = depthInfo.height;
    
    const x = Math.floor(u * (width - 1));
    const y = Math.floor(v * (height - 1));
    
    const index = y * width + x;
    
    if (index >= 0 && index < depthInfo.data.length) {
        return depthInfo.data[index];
    }
    
    return null;
}

}

        const currentMatrix = group.matrix.clone();
        // Transform trục về world space của group
        //const rotation = new THREE.Matrix4().extractRotation(currentMatrix);
        //const worldAxis = localAxis.clone().applyMatrix4(rotation).normalize();
        const worldQuat = new THREE.Quaternion();
        group.getWorldQuaternion(worldQuat);
        const worldAxis = localAxis.clone().applyQuaternion(worldQuat).normalize();
        // Tạo vector dịch chuyển theo world axis
        const moveVec = worldAxis.clone().multiplyScalar(distance);
        // Tạo ma trận dịch chuyển
        const translation = new THREE.Matrix4().makeTranslation(
            moveVec.x,
            moveVec.y, 
            moveVec.z
        );
        // Áp dụng: T * currentMatrix
        const newMatrix = new THREE.Matrix4().multiplyMatrices(translation, currentMatrix);
        // Cập nhật group
        group.matrix.copy(newMatrix);
        
        // CẬP NHẬT PIVOT POINT: Chuyển moveVec từ world space sang local space
        adjustPivotPoint.add(moveVec)
        worldAxesGroup.position.copy(adjustPivotPoint);
    } else {
    }
    // Đảm bảo cập nhật
    group.matrixAutoUpdate = false;
    group.matrixWorldNeedsUpdate = true;
  }
    
// Hàm quay mô hình quanh trục local
// Hàm quay mô hình quanh trục local (quay quanh trục Z thẳng đứng tại pivot point)
function rotateAroundLocalAxis(localAxis, angleRad) {
    if (!currentAnchor || !currentAnchor.group) return;
    const group = currentAnchor.group;
    if (adjustPivotPoint) {
      // Lấy matrix hiện tại
      const currentMatrix = group.matrix.clone();
      // Hãy transform trục về local space của group
      // Chuyển trục local về trục world
      // Lấy ma trận quay của group quanh hệ trục world, ma trận này không chứa phần dịch chuyển
      // Áp dụng ma trận này cho trục local, khi đó trục local sẽ chuyển sang world
      const rotation = new THREE.Matrix4().extractRotation(currentMatrix);
      const worldAxis = localAxis.clone().applyMatrix4(rotation).normalize(); // Chuyển sang world
      // Tạo các ma trận transformation theo phương pháp TRT:
      // T2 * R * T1 * currentMatrix
      // T1: Dịch về pivot (pivot thành gốc tọa độ)
      const T1 = new THREE.Matrix4().makeTranslation(
          -adjustPivotPoint.x, 
          -adjustPivotPoint.y, 
          -adjustPivotPoint.z
      );
      // R: Quay quanh trục Z tại gốc tọa độ
      const R = new THREE.Matrix4().makeRotationAxis(worldAxis, angleRad);
      // T2: Dịch trở lại vị trí pivot
      const T2 = new THREE.Matrix4().makeTranslation(
          adjustPivotPoint.x, 
          adjustPivotPoint.y, 
          adjustPivotPoint.z
      );
      // Kết hợp: T2 * R * T1 * currentMatrix
      const newMatrix = new THREE.Matrix4()
          .multiplyMatrices(T2, R)      // T2 * R
          .multiply(T1)                 // * T1
          .multiply(currentMatrix);     // * currentMatrix
      // Cập nhật group
      group.matrix.copy(newMatrix);
      // Cập nhật position/quaternion/scale để các API khác vẫn hoạt động đúng
      group.matrix.decompose(group.position, group.quaternion, group.scale);
      // Đảm bảo cập nhật
      group.matrixAutoUpdate = false;
      group.matrixWorldNeedsUpdate = true;
    }
}
function rotateAroundWorldAxis(staticLocalAxis, angleRad) {
    if (!currentAnchor || !currentAnchor.group) return;
    const group = currentAnchor.group;
    if (adjustPivotPoint) {
      // Lấy matrix hiện tại
      const currentMatrix = group.matrix.clone();      
      // Cập nhật matrixWorld để đảm bảo dữ liệu chính xác
      //const worldAxis = staticLocalAxis.clone().applyMatrix4(initialWorldMatrix).normalize(); // Chuyển sang world
      const rotation = new THREE.Matrix4().extractRotation(initialGroupMatrix );
      const worldAxis = staticLocalAxis.clone().applyMatrix4(rotation).normalize(); // Chuyển sang world
      // Tạo các ma trận transformation theo phương pháp TRT:
      // T2 * R * T1 * currentMatrix
      // T1: Dịch về pivot (pivot thành gốc tọa độ)
      const T1 = new THREE.Matrix4().makeTranslation(
          -adjustPivotPoint.x, 
          -adjustPivotPoint.y, 
          -adjustPivotPoint.z
      );
      // R: Quay quanh trục Z tại gốc tọa độ
      const R = new THREE.Matrix4().makeRotationAxis(worldAxis, angleRad);
      // T2: Dịch trở lại vị trí pivot
      const T2 = new THREE.Matrix4().makeTranslation(
          adjustPivotPoint.x, 
          adjustPivotPoint.y, 
          adjustPivotPoint.z
      );
      // Kết hợp: T2 * R * T1 * currentMatrix
      const newMatrix = new THREE.Matrix4()
          .multiplyMatrices(T2, R)      // T2 * R
          .multiply(T1)                 // * T1
          .multiply(currentMatrix);     // * currentMatrix
      // Cập nhật group
      group.matrix.copy(newMatrix);
      // Cập nhật position/quaternion/scale để các API khác vẫn hoạt động đúng
      group.matrix.decompose(group.position, group.quaternion, group.scale);
      // Đảm bảo cập nhật
      group.matrixAutoUpdate = false;
      group.matrixWorldNeedsUpdate = true;
    } 
}
 renderer.domElement.addEventListener("touchstart",(e)=>{ 
    if (e.touches.length===1) { 
      isDragging=true; 
      previousTouchX=e.touches[0].clientX; 
      previousTouchY=e.touches[0].clientY; 
    } 
  });
     renderer.domElement.addEventListener("touchmove",(e)=>{ 
    if (isDragging && currentModel && e.touches.length===1) { 
      const dx=e.touches[0].clientX-previousTouchX; 
      const dy=e.touches[0].clientY-previousTouchY; 
      previousTouchX=e.touches[0].clientX; 
      previousTouchY=e.touches[0].clientY; 
      if (adjustMode) {
        // Dịch theo trục X (horizontal drag)
        translateAlongLocalAxis(new THREE.Vector3(1, 0, 0), -dy * 0.001); // Factor nhạy
        // Dịch theo trục Y (vertical drag, negate để up drag positive Y)
        translateAlongLocalAxis(new THREE.Vector3(0, 1, 0), dx * 0.001);
      }
    } 
  });
     renderer.domElement.addEventListener("touchend",()=>
    { 
      isDragging=false; 
    });
  window.addEventListener("resize",()=>{ 
    camera.aspect = window.innerWidth/window.innerHeight; 
    camera.updateProjectionMatrix(); 
    renderer.setSize(window.innerWidth, window.innerHeight); 
  });
